name: Build and Distribute

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v2

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks


      - uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.44.6'

      - uses: cedvdb/action-flutter-build-ios@v1
        with:
          build-cmd: flutter build ipa --release --obfuscate --split-debug-info=./symbols --export-options-plist=ExportOptions.plist
          certificate-base64: 










          certificate-password: 123
          provisioning-profile-base64: 







          keychain-password: 111111
      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/ios/ipa
      
      - name: Upload IPA using official xcrun altool
        shell: bash
        env:
          WORKING_DIRECTORY: build/ios/ipa
          IPA_FILE_NAME: 同城徒遇.ipa
          APPLE_USERNAME: "RubyTorguson16253@outlook.com"
          APPLE_PASSWORD: "vgsi-mpdh-ayae-rvfl"
        run: |
          set -euo pipefail

          echo "Xcode version:"
          xcodebuild -version
          echo "Locating official altool:"
          xcrun --find altool

          cd "$WORKING_DIRECTORY"
          if [[ ! -f "$IPA_FILE_NAME" ]]; then
            echo "指定 IPA 不存在。当前目录内文件："
            ls -lah
            exit 1
          fi

          # Confirm that the file is a valid ZIP container before sending it.
          unzip -tq "$IPA_FILE_NAME" > /dev/null
          echo "IPA 已找到并通过归档完整性检查，开始上传..."

          # The @env: prefix avoids including the actual password in CLI args.
          xcrun altool --upload-app \
            --file "$IPA_FILE_NAME" \
            --type ios \
            --username "$APPLE_USERNAME" \
            --password "@env:APPLE_PASSWORD" \
            --verbose

